name: browser-tests

on:
  # `typecheck` and `playwright` are required status checks on `main` (see
  # docs/validation-topology.md's "Branch protection" section). This trigger
  # used to carry a `paths:` filter so browser tests (Chromium install, a
  # full Playwright run) only started for changes that can affect rendered
  # component behavior — but a required check backed by a path-filtered
  # workflow leaves any PR whose diff matches none of the filter stuck at
  # "Expected" forever, permanently blocking merge.
  #
  # `pull_request` now runs unconditionally instead. The equivalent
  # filtering moved into the `scope` job as a computed `relevant` output —
  # `typecheck`/`playwright` gate on it via `if:`. A job skipped via `if:`
  # reports conclusion "skipped", which GitHub treats as satisfying a
  # required status check, so every PR still reports both required names
  # (fast, if skipped) while the expensive work only runs when relevant.
  pull_request: {}

  # `merge_group` runs `typecheck` and `playwright` against the merge queue's
  # candidate ref — the tree that is actually about to become `main`. A
  # `pull_request` run tests the merge ref as it stood when that run was
  # TRIGGERED, which goes stale the moment anything else lands on `main`; the
  # queue's candidate is rebuilt on the real tip instead. See the same block in
  # unit-tests.yaml for the `main` breakage that motivated this.
  #
  # Both the `scope` job's `relevant` output and its matrix decision fail safe
  # on non-`pull_request` events (`relevant=true`, full matrix), so a queue run
  # is deliberately unscoped: it pays the full Playwright cost in exchange for
  # testing the exact merged result.
  merge_group: {}
  workflow_dispatch:
    inputs:
      mode:
        description: 'visual-regression mode (off | report | block) — only honored by the playwright job, not update-baselines'
        required: false
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'report'
          - 'block'
      update_baselines:
        description: 'Set to true to run update-baselines. Default target opens a snapshot-only follow-up PR; source_branch commits back to source_ref.'
        required: false
        default: false
        type: boolean
      source_ref:
        description: 'Source ref to render baselines from (required when update_baselines=true).'
        required: false
        type: string
      base_ref:
        description: 'Repository default branch required for baseline-update safety checks; source_ref is the snapshot-only PR target.'
        required: false
        type: string
      pull_request_number:
        description: 'Optional originating PR number; used to name the bot branch and link the snapshot PR.'
        required: false
        type: string
      components:
        description: 'Optional comma-separated component slugs for scoped visual-regression runs, e.g. button.'
        required: false
        default: ''
        type: string
      shard:
        description: 'Optional Playwright shard (for example 3/8) used when authoring baselines from the exact enforcement partition.'
        required: false
        default: ''
        type: string
      baseline_update_target:
        description: 'Where update-baselines commits snapshot changes.'
        required: false
        default: 'snapshot_pr'
        type: choice
        options:
          - 'snapshot_pr'
          - 'source_branch'

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0

jobs:
  scope:
    # Decide whether this run executes the full component matrix or scopes
    # to just the components changed in the pull request. `push` to main and
    # `workflow_dispatch` always run the full matrix.
    runs-on: ubuntu-latest
    outputs:
      component_scope_mode: ${{ steps.decide.outputs.component_scope_mode }}
      components: ${{ steps.decide.outputs.components }}
      browser_relevant: ${{ steps.relevance.outputs.browser_relevant }}
      playwright_matrix: ${{ steps.matrix.outputs.playwright_matrix }}
    steps:
      - name: Validate dispatch source ref
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref != ''
        env:
          SOURCE_REF: ${{ github.event.inputs.source_ref }}
        run: |
          set -euo pipefail
          if [ "${SOURCE_REF#refs/}" != "$SOURCE_REF" ]; then
            echo "source_ref must be a branch name, not a full ref: $SOURCE_REF" >&2
            exit 1
          fi
          if ! git check-ref-format --branch "$SOURCE_REF" >/dev/null 2>&1; then
            echo "source_ref is not a valid branch name: $SOURCE_REF" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref || github.ref }}
          # `git diff origin/<base>..HEAD` needs the merge base. fetch-depth: 0
          # is the simplest reliable option; the scope job is fast either way
          # and shallow merge-base lookups are fragile on long-lived PRs.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Decide scope
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          DISPATCH_COMPONENTS: ${{ github.event.inputs.components || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Workflow dispatch component input: ${DISPATCH_COMPONENTS:-<full matrix>}"
            CINDER_TEST_COMPONENTS="$DISPATCH_COMPONENTS" bun run packages/testing/scripts/changed-components.ts
            exit 0
          fi

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Non-PR event ($EVENT_NAME): running full matrix."
            {
              echo "component_scope_mode=full"
              echo "components="
              echo "browser_relevant=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three-dot: diff against the merge base, so only the PR's own changes
          # are considered (not commits that landed on the base since the fork).
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "Changed files:"
          printf '%s\n' "$changed"

          # The script appends `component_scope_mode=<value>` (and
          # `components=<csv>` when filtered) directly to $GITHUB_OUTPUT — no
          # shell parsing of its stdout needed. A non-zero exit fails the job
          # loudly.
          printf '%s\n' "$changed" | bun run packages/testing/scripts/changed-components.ts

      - name: Record shared browser scope
        id: relevance
        # This workflow no longer declares an `on.pull_request.paths` filter
        # (see docs/validation-topology.md's "Branch protection" section): a
        # required check backed by a path-filtered workflow leaves any PR
        # whose diff matches none of the filter stuck at "Expected" forever.
        # The equivalent filtering now happens HERE, in code, as a job output
        # instead of a workflow trigger — `typecheck`/`playwright` gate on
        # `needs.scope.outputs.relevant` via `if:` below. A job skipped via
        # `if:` reports conclusion "skipped", and GitHub treats a skipped
        # check run as satisfying a required status check — so every PR
        # still reports both required names, but the expensive jobs actually
        # only run when relevant. One workflow, one job name each — no
        # duplicate-named mirror workflow, so no risk of the "ambiguous
        # status check results" GitHub warns same-named checks across
        # workflows can cause.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          CLASSIFIER_BROWSER_RELEVANT: ${{ steps.decide.outputs.browser_relevant }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            # push (already path-filtered at the workflow level, unchanged)
            # and workflow_dispatch always run the real jobs.
            echo "browser_relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Reimplements, in code, the path list this workflow used to declare
          # at `on.pull_request.paths` (last-match-wins, following the same
          # ordering rule as GitHub's real path-filter algorithm — a later
          # pattern overrides an earlier one, so a `!`-prefixed negation
          # excludes a path only if nothing after it re-includes it).
          #
          # This is a best-effort SUPERSET of GitHub's real path-filter
          # matching, not an exact mirror: bash's `[[ str == pattern ]]` gives
          # `*` and `**` identical semantics (both cross `/`), whereas
          # GitHub's own filter treats a single `*` as single-segment and only
          # `**` as crossing directories. That divergence only ever makes this
          # check MORE inclusive than GitHub's real filter would be (matching
          # a few extra deeply-nested paths for a `packages/*/…` pattern) —
          # which fails safe toward running `typecheck`/`playwright`, never
          # toward skipping them incorrectly.
          PATTERNS=(
            'packages/components/src/**'
            'packages/components/components.json'
            'packages/components/package.json'
            'packages/components/scripts/**'
            'packages/chat/**'
            'packages/*/package.json'
            'packages/*/scripts/**'
            'packages/*/tsconfig*.json'
            'packages/editor/src/**'
            'packages/editor/components.json'
            'packages/markdown/src/**'
            'packages/playground/src/**'
            'packages/playground/scripts/**'
            'packages/testing/**'
            '.github/workflows/browser-tests.yaml'
            'package.json'
            'bun.lock'
            'bun.lockb'
            'bunfig.toml'
            'packages/*/bunfig.toml'
            'turbo.json'
            '.npmrc'
            'tsconfig*.json'
            '!packages/**/*.md'
            '!packages/**/README*'
            '!packages/**/CHANGELOG*'
          )

          is_relevant_file() {
            local file="$1"
            local matched=false
            for pattern in "${PATTERNS[@]}"; do
              local negate=false
              local candidate="$pattern"
              if [[ "$candidate" == !* ]]; then
                negate=true
                candidate="${candidate#!}"
              fi
              # shellcheck disable=SC2053 # candidate is deliberately a glob pattern.
              if [[ "$file" == $candidate ]]; then
                if [ "$negate" = true ]; then matched=false; else matched=true; fi
              fi
            done
            [ "$matched" = true ]
          }

          # Fail SAFE to relevant=true on any error deriving the diff — a
          # missed edge here must never silently skip typecheck/playwright,
          # only ever skip them when we're SURE the diff is irrelevant.
          relevant=true
          if changed=$(git diff --name-only "origin/${BASE_REF}...HEAD"); then
            relevant=false
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if is_relevant_file "$file"; then
                relevant=true
                break
              fi
            done <<< "$changed"
          fi

          # The component classifier has one narrower, semantically-aware
          # exclusion: static guard scripts have no browser surface. Preserve
          # that result while retaining this path matcher for documentation-only
          # changes, which the component graph intentionally treats as full.
          if [ "$CLASSIFIER_BROWSER_RELEVANT" = false ]; then
            relevant=false
          fi

          # The shared classifier above owns the fail-safe decision. Keep this
          # step only as a human-readable summary while migrating old logs.
          echo "browser_relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "browser_relevant=$relevant" >> "$GITHUB_STEP_SUMMARY"

      - name: Select Playwright shard matrix
        id: matrix
        run: |
          # Component filtering trims generated visual cases, but every other
          # browser spec still runs. Preserve the same bounded worker lifetime
          # for filtered and full runs instead of collapsing hundreds of tests
          # into one long-lived browser process.
          echo 'playwright_matrix={"shard":[1,2,3,4,5,6,7,8]}' >> "$GITHUB_OUTPUT"

  typecheck:
    needs: scope
    # `!cancelled()` + explicit result/output checks, NOT the bare
    # `needs.scope.outputs.relevant == 'true'` this used to read: by default a
    # job with `needs: scope` is silently SKIPPED if `scope` fails for ANY
    # reason (e.g. `changed-components.ts` erroring before the "Decide
    # whether this diff is browser-test relevant" step even runs) — and a
    # skipped required check satisfies branch protection. That would be a
    # fail-OPEN hole: an unhealthy `scope` job would silently let a real
    # regression merge instead of blocking it. `!cancelled()` forces this
    # condition to evaluate regardless of `scope`'s success/failure, so a
    # `scope` failure runs this job (fail safe) instead of skipping it (fail
    # open) — only a scope job that SUCCEEDED and explicitly determined the
    # diff irrelevant skips this one.
    #
    # Deliberately `!cancelled()`, NOT `always()`: GitHub documents that a
    # truthy `always()` condition keeps a job from being cancelled even when
    # the workflow is cancelled (e.g. a newer push superseding this run via
    # the `browser-tests-${{ github.ref }}` concurrency group) — so an
    # `always()`-gated Playwright/typecheck job would keep burning its full
    # runner budget on an already-superseded run. `!cancelled()` gives the
    # same "run despite scope failing" behavior without disabling
    # cancellation.
    if: "!cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.browser_relevant == 'true')"
    # Runs the workspace typecheck against a fresh checkout — explicitly does
    # NOT pre-build cinder. Catches the regression class where `cinder/<name>`
    # imports stop resolving via the package's exports map (svelte/types
    # condition mismatch, missing customConditions, dropped source-export, etc).
    # See packages/playground/tsconfig.json for context.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck workspace
        run: bun run typecheck

  playwright-lane:
    needs: scope
    # See the `typecheck` job's comment: `!cancelled()` + explicit
    # result/output checks so a `scope` job FAILURE runs this job (fail safe)
    # instead of silently skipping it (fail open, since a skipped required
    # check still satisfies branch protection), while still respecting
    # cancellation from a superseding push — unlike `always()`, which GitHub
    # documents as keeping a job from being cancelled, and would otherwise
    # let an obsolete 30-minute Playwright run keep consuming its full
    # runner budget after a newer push already superseded it. Only a `scope`
    # job that succeeded and explicitly determined the diff irrelevant skips
    # this one.
    if: "!cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.browser_relevant == 'true') && (github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'off')"
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user root
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.result == 'success' && needs.scope.outputs.playwright_matrix || '{"shard":[1,2,3,4,5,6,7,8]}') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-bun downloads a zip release. The Playwright image deliberately
      # omits archive utilities, so install only the bootstrap tool before it
      # runs; browser and OS dependencies still come from the pinned image.
      - name: Install Bun bootstrap dependency
        run: apt-get update && apt-get install --no-install-recommends --yes unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore workspace builds through Turbo
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: bunx turbo run build --filter=@cinder/playground...

      - name: Run Playwright suite
        # What CINDER_VISUAL_DIFF actually governs: screenshot capture-vs-compare
        # (off = record a PNG and return; report/block = diff against the
        # committed baseline) and host-vs-Docker execution. It does NOT gate the
        # suite. The axe accessibility gate runs in EVERY mode — runAxe() and
        # evaluateAxeGate() are called unconditionally per component test, and
        # the assertion fails the test regardless of the mode.
        #
        # The real residual limitation is scope, not mode: on filtered PRs
        # CINDER_TEST_COMPONENTS is applied before the test-generation loop, so a
        # PR that maps cleanly to component A gets no axe coverage of component
        # B. Token and global-style changes force full scope, so broad theme
        # changes are always swept.
        env:
          CI: 'true'
          CINDER_TEST_SCOPE_MODE: ${{ needs.scope.result == 'success' && needs.scope.outputs.component_scope_mode || 'full' }}
          # Empty when component_scope_mode=full; comma-separated slug list when filtered.
          CINDER_TEST_COMPONENTS: ${{ needs.scope.outputs.component_scope_mode == 'filtered' && needs.scope.outputs.components || '' }}
          # Trace recording is kept only for the full main-branch run.
          PLAYWRIGHT_TRACE: ${{ (needs.scope.result != 'success' || needs.scope.outputs.component_scope_mode == 'full') && 'retain-on-failure' || 'off' }}
          CINDER_VISUAL_DIFF: 'off'
          PLAYGROUND_DEPENDENCIES_PREBUILT: '1'
        run: |
          echo "Scope: $CINDER_TEST_SCOPE_MODE"
          echo "Visual-diff mode: $CINDER_VISUAL_DIFF"
          if [ -n "${CINDER_TEST_COMPONENTS:-}" ]; then
            echo "Components: $CINDER_TEST_COMPONENTS"
          fi
          bun run test:browser -- --shard=${{ matrix.shard }}/8 --reporter=blob

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: packages/testing/playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: packages/testing/blob-report
          retention-days: 14
          if-no-files-found: warn

      - name: Upload axe JSON results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-results-${{ matrix.shard }}
          path: packages/testing/test-results/axe
          retention-days: 14
          if-no-files-found: warn

      - name: Upload axe summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-summary-${{ matrix.shard }}
          path: packages/testing/test-results/axe-summary.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload screenshots
        # Always upload: v1 is record-only, so the suite passes even when
        # there's something visually interesting in the screenshots. The
        # 7-day retention bounds the storage cost.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.shard }}
          path: packages/testing/screenshots
          retention-days: 7
          if-no-files-found: warn

      - name: Merge visual-report fragments
        # Phase 3 'report' mode writes per-test JSON fragments under
        # test-results/visual-report/. Merge them into a single report,
        # then surface a job summary so reviewers see mismatched cases
        # without downloading the artifact.
        if: always() && env.CINDER_VISUAL_DIFF == 'report'
        env:
          CINDER_VISUAL_DIFF: ${{ github.event.inputs.mode || 'off' }}
        run: |
          set -euo pipefail
          REPORT_DIR=packages/testing/test-results/visual-report
          if [ ! -d "$REPORT_DIR" ]; then
            echo "No visual-report fragments emitted; nothing to merge."
            exit 0
          fi
          MERGED=packages/testing/test-results/visual-report.json
          find "$REPORT_DIR" -name '*.json' -print0 \
            | xargs -0 -I {} cat {} \
            | jq -s '.' > "$MERGED"
          COUNT=$(jq 'length' "$MERGED")
          {
            echo "## Visual-regression report ($COUNT mismatched case(s))"
            echo ""
            if [ "$COUNT" -gt 0 ]; then
              echo "| Slug | Theme | Viewport | Fixture | Diff Pixels |"
              echo "| --- | --- | --- | --- | --- |"
              jq -r '.[] | "| \(.slug) | \(.theme) | \(.viewport) | \(.fixture) | \(.diffPixels) |"' "$MERGED"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload visual-report
        if: always() && env.CINDER_VISUAL_DIFF == 'report'
        env:
          CINDER_VISUAL_DIFF: ${{ github.event.inputs.mode || 'off' }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: packages/testing/test-results/visual-report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Post sticky PR comment (best-effort)
        # Best-effort: forked PRs lack pull-requests:write permission.
        # The Job Summary and HTML report artifact are the authoritative
        # signal; this comment is convenience.
        if: always() && env.CINDER_VISUAL_DIFF == 'report' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          CINDER_VISUAL_DIFF: ${{ github.event.inputs.mode || 'off' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: visual-regression-report
          path: packages/testing/test-results/visual-report.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The visual-diff wrapper owns Docker build/run itself, so it must remain on
  # the host runner. Ordinary full Playwright coverage stays in the pinned
  # Playwright container above.
  playwright-visual-shard:
    name: playwright-visual shard ${{ matrix.shard }}
    needs: scope
    # Block pull requests and merge-queue entries after the report-mode soak.
    # Manual dispatch keeps its explicit mode for diagnostics.
    if: "!cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'off'))"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.result == 'success' && needs.scope.outputs.playwright_matrix || '{"shard":[1,2,3,4,5,6,7,8]}') }}
    env:
      CINDER_VISUAL_DIFF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'block' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Run visual-regression Docker wrapper
        env:
          CI: 'true'
          CINDER_TEST_COMPONENTS: ${{ needs.scope.outputs.component_scope_mode == 'filtered' && needs.scope.outputs.components || '' }}
          CINDER_VISUAL_DIFF: ${{ env.CINDER_VISUAL_DIFF }}
        run: bun run --filter=@cinder/testing test:browser:docker -- --shard=${{ matrix.shard }}/8
      - name: Merge visual-report fragments
        if: always() && env.CINDER_VISUAL_DIFF == 'report'
        run: |
          set -euo pipefail
          REPORT_DIRECTORY=packages/testing/test-results/visual-report
          if [ ! -d "$REPORT_DIRECTORY" ]; then
            echo "No visual-report fragments emitted; nothing to merge."
            exit 0
          fi
          find "$REPORT_DIRECTORY" -name '*.json' -print0 \
            | xargs -0 -I {} cat {} \
            | jq -s '.' > packages/testing/test-results/visual-report.json
      - name: Upload visual report
        if: always() && env.CINDER_VISUAL_DIFF == 'report'
        uses: actions/upload-artifact@v7
        with:
          name: visual-report-${{ matrix.shard }}
          path: packages/testing/test-results/visual-report.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload visual failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-diagnostics-${{ matrix.shard }}
          path: |
            packages/testing/playwright-report
            packages/testing/test-results
            packages/testing/screenshots
          retention-days: 14
          if-no-files-found: warn

  # A matrix job produces one check per shard. Keep those names distinct and
  # expose one non-matrix result for branch protection to require.
  playwright-visual:
    name: ${{ github.event_name == 'workflow_dispatch' && format('playwright-visual ({0})', github.event.inputs.mode) || 'playwright-visual' }}
    needs: [scope, playwright-visual-shard]
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'off')"
    runs-on: ubuntu-latest
    steps:
      - name: Require visual-regression shards to succeed
        env:
          SCOPE: ${{ needs.scope.result }}
          VISUAL_SHARDS: ${{ needs.playwright-visual-shard.result }}
        run: |
          set -euo pipefail
          echo "scope=$SCOPE playwright-visual-shard=$VISUAL_SHARDS" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$SCOPE" = success ]
          [ "$VISUAL_SHARDS" = success ]

  playwright:
    name: ${{ github.event_name == 'workflow_dispatch' && format('playwright ({0})', github.event.inputs.mode) || 'playwright' }}
    needs: [scope, playwright-lane, playwright-visual]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Download blob reports
        if: "always() && needs.playwright-lane.result != 'skipped'"
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-*
          path: packages/testing/blob-reports
          merge-multiple: true
      - name: Merge sharded report
        if: "always() && needs.playwright-lane.result != 'skipped'"
        run: bunx playwright merge-reports --reporter html packages/testing/blob-reports
      - name: Merge sharded visual reports
        if: "always() && needs.playwright-visual.result != 'skipped' && github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'report'"
        uses: actions/download-artifact@v8
        with:
          pattern: visual-report-*
          path: packages/testing/visual-reports
      - name: Publish merged visual report
        if: "always() && needs.playwright-visual.result != 'skipped' && github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'report'"
        run: |
          set -euo pipefail
          REPORTS=packages/testing/visual-reports
          if [ -d "$REPORTS" ] && find "$REPORTS" -name '*.json' -print -quit | grep -q .; then
            find "$REPORTS" -name '*.json' -print0 | xargs -0 jq -s 'add' > packages/testing/visual-report.json
          fi
      - name: Upload merged report
        if: "always() && needs.playwright-lane.result != 'skipped'"
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-merged
          path: playwright-report
          retention-days: 14
          if-no-files-found: warn
      - name: Upload merged visual report
        if: "always() && needs.playwright-visual.result != 'skipped' && github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'report'"
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: packages/testing/visual-report.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Require the selected Playwright mode to succeed
        env:
          SCOPE: ${{ needs.scope.result }}
          LANES: ${{ needs.playwright-lane.result }}
          VISUAL: ${{ needs.playwright-visual.result }}
          RELEVANT: ${{ needs.scope.outputs.browser_relevant }}
          EVENT_NAME: ${{ github.event_name }}
          VISUAL_MODE: ${{ github.event.inputs.mode || 'off' }}
        run: |
          set -euo pipefail
          echo "scope=$SCOPE relevant=$RELEVANT playwright-lane=$LANES playwright-visual=$VISUAL mode=$VISUAL_MODE" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$VISUAL_MODE" != off ]; then
            [ "$SCOPE" = success ]
            [ "$VISUAL" = success ]
            exit 0
          fi
          [ "$SCOPE" = success ] || exit 1
          if [ "$RELEVANT" = true ]; then [ "$LANES" = success ] || exit 1; fi
          # Pull-request and merge-queue runs always select block mode for
          # visual regression. Keep their aggregate required check fail-closed
          # so a failed visual job cannot be masked by passing functional lanes.
          # A manual `mode=off` dispatch intentionally skips the visual job.
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ]; then
            [ "$VISUAL" = success ] || exit 1
          fi

  baseline-coverage:
    name: ${{ github.event_name == 'workflow_dispatch' && 'baseline-coverage (diagnostic)' || 'baseline-coverage' }}
    # Runs on every trigger, including pull requests. The check is scoped per
    # slug: a component is enforced only once it has adopted baselines, so
    # incremental adoption no longer makes this unconditionally red. Components
    # without baselines are listed as "pending" and orphaned PNGs are reported
    # without failing the job.
    #
    # Gated on scope relevance like `typecheck` and `playwright` above, so a
    # docs-only pull request does not pay to boot the playground. The
    # report-mode soak completed before this promotion. Missing adopted
    # baselines now block the pull request with the named coverage gap. A
    # baseline-authoring dispatch validates the pre-generation checkout, so it
    # intentionally skips this check and lets update-baselines create the fix.
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || github.event.inputs.update_baselines != 'true') && (needs.scope.result != 'success' || needs.scope.outputs.browser_relevant == 'true')"
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare manifest
        # baseline-coverage-check reads the cached manifest; ensure it's fresh.
        run: bun run --filter=@cinder/testing test:playwright -- --list

      - name: Verify baseline coverage
        # Fails with a named list of missing combinations when a component that
        # has already adopted baselines is missing any of them — a new fixture
        # or viewport cannot land half-covered. Pending and orphan lines are
        # informational. The exit code drives the job result.
        env:
          CINDER_TEST_COMPONENTS: ${{ needs.scope.outputs.component_scope_mode == 'filtered' && needs.scope.outputs.components || '' }}
        run: bun run packages/testing/scripts/baseline-coverage-check.ts

  update-baselines:
    # Manual-only. Runs inside the canonical Playwright Docker image,
    # writes baselines, then either opens a snapshot-only follow-up PR
    # or commits the scoped baseline update back to source_ref.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_baselines == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate inputs
        env:
          SOURCE_REF: ${{ github.event.inputs.source_ref }}
          BASE_REF: ${{ github.event.inputs.base_ref }}
          COMPONENTS: ${{ needs.scope.outputs.components }}
          TARGET: ${{ github.event.inputs.baseline_update_target || 'snapshot_pr' }}
          SHARD: ${{ github.event.inputs.shard || '' }}
        run: |
          set -euo pipefail
          validate_branch_ref() {
            local label="$1"
            local value="$2"
            if [ "${value#refs/}" != "$value" ]; then
              echo "$label must be a branch name, not a full ref: $value" >&2
              exit 1
            fi
            if ! git check-ref-format --branch "$value" >/dev/null 2>&1; then
              echo "$label is not a valid branch name: $value" >&2
              exit 1
            fi
          }

          if [ -z "$SOURCE_REF" ] || [ -z "$BASE_REF" ]; then
            echo "update-baselines requires both source_ref and base_ref inputs." >&2
            exit 1
          fi
          validate_branch_ref source_ref "$SOURCE_REF"
          validate_branch_ref base_ref "$BASE_REF"
          if [ -n "$SHARD" ] && ! [[ "$SHARD" =~ ^[1-8]/8$ ]]; then
            echo "shard must use the form N/8 where N is 1 through 8; got $SHARD" >&2
            exit 1
          fi
          case "$TARGET" in
            snapshot_pr|source_branch) ;;
            *)
              echo "baseline_update_target must be snapshot_pr or source_branch; got $TARGET" >&2
              exit 1
              ;;
          esac
          if [ "$TARGET" = "source_branch" ]; then
            if [ -z "$COMPONENTS" ] && [ -z "$SHARD" ]; then
              echo "source_branch baseline updates require an explicit components scope or validated shard." >&2
              exit 1
            fi
            if [ "$SOURCE_REF" = "$BASE_REF" ]; then
              echo "source_branch baseline updates cannot target the base branch: $SOURCE_REF" >&2
              exit 1
            fi
          fi
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "base_ref must be the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi
          if [ "$SOURCE_REF" = "$DEFAULT_BRANCH" ]; then
            echo "source_ref cannot be the protected default branch: $SOURCE_REF" >&2
            exit 1
          fi

      - name: Checkout source ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Record rendered source SHA
        id: source-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Docker image and update baselines
        env:
          # A Playwright shard identifies a partition of the full enforcement
          # suite. Do not first filter that suite by component, or `N/8` would
          # identify a different partition than the blocking matrix.
          CINDER_TEST_COMPONENTS: ${{ github.event.inputs.shard == '' && needs.scope.outputs.component_scope_mode == 'filtered' && needs.scope.outputs.components || '' }}
          CINDER_TEST_SHARD: ${{ github.event.inputs.shard || '' }}
          SHARD: ${{ github.event.inputs.shard || '' }}
        run: |
          if [ -n "$SHARD" ]; then
            bun run --filter=@cinder/testing test:browser:update:docker -- --shard="$SHARD"
          else
            bun run --filter=@cinder/testing test:browser:update:docker
          fi

      - name: Check for snapshot changes
        id: changes
        run: |
          set +e
          bun run packages/testing/scripts/snapshot-change-detection.ts
          status=$?
          set -e

          case "$status" in
            0)
              echo "changed=true" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No baseline PNG or provenance changes; nothing to commit."
              ;;
            *)
              echo "Snapshot change detection failed with exit code $status." >&2
              exit "$status"
              ;;
          esac

      - name: Create snapshot-only PR
        if: steps.changes.outputs.changed == 'true' && (github.event.inputs.baseline_update_target || 'snapshot_pr') == 'snapshot_pr'
        env:
          SOURCE_REF: ${{ github.event.inputs.source_ref }}
          BASE_REF: ${{ github.event.inputs.base_ref }}
          PR_NUMBER: ${{ github.event.inputs.pull_request_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ -n "${PR_NUMBER:-}" ] && ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Ignoring non-numeric pull_request_number: $PR_NUMBER" >&2
            PR_NUMBER=""
          fi
          BRANCH="bot/snapshots/${PR_NUMBER:-$SHORT_SHA}"
          SNAPSHOT_STAGING="$(mktemp -d)"
          mkdir -p "$SNAPSHOT_STAGING/packages/testing"
          cp -R packages/testing/snapshots "$SNAPSHOT_STAGING/packages/testing/snapshots"
          git config user.name "cinder-bot"
          git config user.email "cinder-bot@users.noreply.github.com"
          # A snapshot-only PR must compare the snapshots with the source
          # tree that produced them. Targeting base_ref creates a cycle: the
          # source PR sees new pixels against old baselines, while the
          # follow-up sees old source against new baselines.
          git fetch origin "$SOURCE_REF"
          if [ "$(git rev-parse FETCH_HEAD)" != "${{ steps.source-sha.outputs.sha }}" ]; then
            echo "source branch moved while baselines were rendered; sync and rerun baseline update" >&2
            exit 1
          fi
          git checkout -f -B "$BRANCH" FETCH_HEAD
          # The Docker writer creates baseline PNGs as root. `git checkout`
          # intentionally leaves those untracked paths in place, so replace
          # the tree before copying the staged snapshot set into this clean,
          # bot-owned branch checkout.
          sudo rm -rf packages/testing/snapshots
          mkdir -p packages/testing/snapshots
          cp -R "$SNAPSHOT_STAGING/packages/testing/snapshots/." packages/testing/snapshots/
          git add packages/testing/snapshots
          if git diff --cached --quiet; then
            echo "Snapshot baselines already match ${SOURCE_REF}; no PR needed."
            exit 0
          fi
          git commit -m "chore(snapshots): regenerate baselines from ${SOURCE_REF}"
          git push origin "$BRANCH" --force-with-lease
          BODY="Snapshot-only update generated by the update-baselines workflow from \`${SOURCE_REF}\`."
          BODY="$BODY"$'\n\n'"Merge this follow-up into \`${SOURCE_REF}\` before merging its implementation PR."
          if [ -n "${PR_NUMBER:-}" ]; then
            BODY="$BODY"$'\n\n'"Related: #${PR_NUMBER}"
          fi
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base "$SOURCE_REF" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --title "chore(snapshots): regenerate from ${SOURCE_REF}" \
              --body "$BODY"
          else
            gh pr create \
              --base "$SOURCE_REF" \
              --head "$BRANCH" \
              --title "chore(snapshots): regenerate from ${SOURCE_REF}" \
              --body "$BODY"
          fi

      - name: Commit snapshots to source branch
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.baseline_update_target == 'source_branch'
        env:
          SOURCE_REF: ${{ github.event.inputs.source_ref }}
          RENDERED_SOURCE_SHA: ${{ steps.source-sha.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "cinder-bot"
          git config user.email "cinder-bot@users.noreply.github.com"
          git add packages/testing/snapshots
          git commit -m "chore(snapshots): add scoped baselines for ${SOURCE_REF}"
          REMOTE_SHA=$(git ls-remote --heads origin "$SOURCE_REF" | awk '{print $1}')
          if [ -z "$REMOTE_SHA" ]; then
            echo "source branch missing on origin: $SOURCE_REF" >&2
            exit 1
          fi
          if [ "$REMOTE_SHA" != "$RENDERED_SOURCE_SHA" ]; then
            echo "source branch moved; sync and rerun baseline update" >&2
            echo "expected: $RENDERED_SOURCE_SHA" >&2
            echo "actual:   $REMOTE_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:${SOURCE_REF}" || {
            echo "failed to push baseline commit to ${SOURCE_REF}; check workflow permissions or branch protection" >&2
            exit 1
          }
