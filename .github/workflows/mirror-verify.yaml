        working-directory: .
        run: |
          bun install --frozen-lockfile

      - name: Prepare mirror-verify scratch directories
        run: mkdir -p '${{ runner.temp }}/mirror-verify/tarballs' '${{ runner.temp }}/mirror-verify/consumer'

      - name: build @lostgradient/markdown
        working-directory: packages/markdown
        run: |
          bun run build

      - name: build @lostgradient/cinder
        working-directory: packages/components
        run: |
