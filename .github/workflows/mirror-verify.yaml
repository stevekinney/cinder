      - name: pack @lostgradient/markdown
        working-directory: packages/markdown
        run: |
          bun run scripts/pack-for-publish.ts

      - name: prepare the shared tarballs directory for @lostgradient/markdown
        working-directory: packages/markdown
        run: |
          mkdir -p ${{ runner.temp }}/mirror-verify/tarballs

      - name: move @lostgradient/markdown's packed tarball into the shared tarballs directory
        working-directory: packages/markdown
        run: |
          bun -e 'const [source, stem, destination] = process.argv.slice(-3); const { readFileSync, renameSync } = require("node:fs"); const { version } = JSON.parse(readFileSync("package.json", "utf8")); renameSync(require("node:path").join(source, stem + "-" + version + ".tgz"), destination);' . lostgradient-markdown ${{ runner.temp }}/mirror-verify/tarballs/lostgradient-markdown.tgz

      - name: check @lostgradient/markdown's packed README
        working-directory: .
        run: |
          bun -e 'const archive = Bun.spawn(["tar", "-xOf", process.argv.at(-1), "package/README.md"], {stdout: "pipe", stderr: "pipe"}); const [text, , status] = await Promise.all([new Response(archive.stdout).text(), new Response(archive.stderr).text(), archive.exited]); const marker = ["workspace:*","Corvidae"].find(value => text.includes(value)); const result = status !== 0 ? {ok: false, problem: {kind: "missing"}} : marker ? {ok: false, problem: {kind: "internal-marker", marker}} : {ok: true}; console.log(JSON.stringify(result)); process.exit(result.ok ? 0 : 1);' ${{ runner.temp }}/mirror-verify/tarballs/lostgradient-markdown.tgz

