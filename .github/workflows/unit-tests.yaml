name: unit-tests

on:
  pull_request: {}
  merge_group: {}
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.0
  TURBO_SCM_BASE: origin/${{ github.base_ref }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      components: ${{ steps.decide.outputs.components }}
      cinder_components: ${{ steps.decide.outputs.cinder_components }}
      unit_lanes: ${{ steps.decide.outputs.unit_lanes }}
      full_scope_reason: ${{ steps.decide.outputs.full_scope_reason }}
      component_matrix: ${{ steps.matrix.outputs.component_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            printf '%s\n' 'mode=full' 'component_scope_mode=full' 'components=' 'cinder_components=' 'unit_lanes=static,package,playground,components' 'full_scope_reason=non-pull-request event' >> "$GITHUB_OUTPUT"
          else
            bun run --filter=@lostgradient/cinder check:timeout-increases
            git diff --name-only "origin/${BASE_REF}...HEAD" | bun run packages/testing/scripts/changed-components.ts
          fi
      - id: matrix
        env:
          MODE: ${{ steps.decide.outputs.mode }}
        run: |
          if [ "$MODE" = full ]; then
            echo 'component_matrix={"chunk":[1,2,3,4]}' >> "$GITHUB_OUTPUT"
          else
            echo 'component_matrix={"chunk":[0]}' >> "$GITHUB_OUTPUT"
          fi
      - run: |
          {
            echo '## CI scope'
            echo "- Mode: ${{ steps.decide.outputs.mode }}"
            echo "- Unit lanes: ${{ steps.decide.outputs.unit_lanes }}"
            echo "- Full-scope reason: ${{ steps.decide.outputs.full_scope_reason || 'none' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  static-artifact:
    needs: scope
    if: "!cancelled() && (needs.scope.result != 'success' || contains(needs.scope.outputs.unit_lanes, 'static'))"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: turbo-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Static, generated, and workflow contracts
        run: |
          bunx turbo run lint
          bun run --filter=@lostgradient/cinder lint:invariants
          bunx stylelint 'packages/**/src/**/*.{css,svelte}'
          bun run --filter=@lostgradient/cinder aggregator:check
          bun run --filter=@lostgradient/cinder tokens:audit -- --strict
          bun run --filter=@lostgradient/cinder components:check
          bun run --filter=@lostgradient/chat components:check
          bun run --filter=@lostgradient/editor components:check
          bun run --filter=@lostgradient/cinder validate:consumer:manifest-smoke
          bun run --filter=@lostgradient/cinder validate:release-workflow
          bun test packages/testing/scripts/pinned-bun-version.test.ts
          bun test packages/components/scripts/check-css-duplication.test.ts
      # Keep the PR artifact lane aligned with main-green for the Linux browser
      # launch path. This lane runs for every PR scope, including styles,
      # token, and script-only changes, so a runner-level hydration regression
      # cannot wait until after merge to be detected.
      - name: Normalize Ubuntu mirror for Playwright dependencies
        run: >-
          sudo sed -i
          's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g'
          /etc/apt/apt-mirrors.txt

      - name: Install Chromium for hydration smoke
        run: bunx playwright install --with-deps chromium

      - name: Consumer hydration smoke (cinder)
        run: bun run --filter=@lostgradient/cinder validate:consumer:hydration-smoke

      - name: Validate workflow contracts
        run: bun test packages/components/scripts/validate-release-workflow.test.ts

  package:
    needs: scope
    if: "!cancelled() && (needs.scope.result != 'success' || contains(needs.scope.outputs.unit_lanes, 'package'))"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build and package tests
        env:
          AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          bunx turbo run build --filter=@lostgradient/cinder --filter=@lostgradient/cinder-mcp --filter=@lostgradient/chat $AFFECTED
          bun run test:workspace-scripts
          if [ "${{ github.event_name }}" = pull_request ]; then
            bunx turbo run test --filter="@lostgradient/markdown...[origin/${BASE_REF}...HEAD]" --filter="@lostgradient/editor...[origin/${BASE_REF}...HEAD]" --filter="@lostgradient/cinder-mcp...[origin/${BASE_REF}...HEAD]"
          else
            bunx turbo run test --filter=@lostgradient/markdown --filter=@lostgradient/editor --filter=@lostgradient/cinder-mcp
          fi
          # No $AFFECTED here, deliberately: unlike a plain `--affected` run,
          # intersected with an explicit `--filter` it can drop the coverage
          # ratchet from the task graph entirely on a pull request. See the
          # `test:coverage` entry in check-pipeline-coverage.ts's
          # DECLARATION_TABLE for the reproduction and the reasoning.
          bunx turbo run test:coverage --filter=@lostgradient/chat --filter=@lostgradient/cinder

  playground:
    needs: scope
    if: "!cancelled() && (needs.scope.result != 'success' || contains(needs.scope.outputs.unit_lanes, 'playground'))"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            bunx turbo run test --filter="@cinder/playground...[origin/${BASE_REF}...HEAD]"
          else
            bunx turbo run test --filter=@cinder/playground
          fi
          bun run --filter=@cinder/playground check:source-temp

  playground-production-producer:
    needs: scope
    if: "!cancelled() && (needs.scope.result != 'success' || contains(needs.scope.outputs.unit_lanes, 'playground'))"
    name: playground-production-producer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/install-dependencies
      - name: Build credential-independent static export
        run: PLAYGROUND_BASE_URL=https://cinder.website bun run --filter=@cinder/playground vercel-build
      - name: Verify static evidence mechanisms
        run: bun run check:playground-evidence
      - name: Verify static Playground production artifact
        run: bun run check:playground-production -- --directory packages/playground/public --verify-only
      - name: Assert Playground production evidence exists
        run: |
          test -f packages/playground/static-playground-report.json
          test -f packages/playground/static-export-metadata.json
      - name: Package immutable production artifact
        run: |
          set -euo pipefail
          mkdir -p .playground-artifact/static
          cp -R packages/playground/public/. .playground-artifact/static/
          cp packages/playground/static-export-metadata.json packages/playground/static-playground-report.json .playground-artifact/
          bun run packages/testing/scripts/playground-artifact-tree.ts --write --root .playground-artifact --manifest .playground-artifact/artifact-tree-manifest.json
          tar -cf .playground-artifact/playground-production-artifact.tar -C .playground-artifact static static-export-metadata.json static-playground-report.json artifact-tree-manifest.json
          test -f packages/playground/static-playground-report.json
      - name: Upload Playground production evidence
        uses: actions/upload-artifact@v7
        with:
          name: playground-production-artifact-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          if-no-files-found: error
          path: .playground-artifact/playground-production-artifact.tar

  playground-production:
    needs: [scope, playground-production-producer]
    if: "always() && !cancelled() && (needs.scope.result != 'success' || contains(needs.scope.outputs.unit_lanes, 'playground'))"
    uses: ./.github/workflows/playground-production.yaml
    with:
      artifact-name: playground-production-artifact-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      producer-result: ${{ needs.playground-production-producer.result }}
      directory-mode: static
      source-sha: ${{ github.sha }}

  browser-runner-lifecycle:
    needs: scope
    if: '!cancelled()'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/install-dependencies
      - name: Verify browser-runner descendant cleanup
        run: |
          bun test packages/testing/scripts/start-server.test.ts packages/testing/scripts/kill-playground.test.ts packages/testing/scripts/playground-exit-report.test.ts
          bun run --filter=@cinder/testing typecheck

  component:
    needs: scope
    if: "!cancelled() && (needs.scope.result != 'success' || contains(needs.scope.outputs.unit_lanes, 'components'))"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.result == 'success' && needs.scope.outputs.component_matrix || '{"chunk":[1,2,3,4]}') }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - env:
          CINDER_TEST_MODE: ${{ needs.scope.result == 'success' && needs.scope.outputs.mode || 'full' }}
          CINDER_TEST_COMPONENTS: ${{ needs.scope.outputs.cinder_components }}
          CINDER_TEST_FULL_SUITE_CHUNK: ${{ (needs.scope.result != 'success' || needs.scope.outputs.mode == 'full') && matrix.chunk || '' }}
        run: |
          if [ "$CINDER_TEST_MODE" = filtered ] && [ -z "$CINDER_TEST_COMPONENTS" ]; then exit 0; fi
          bun run --filter=@lostgradient/cinder test:changed

  unit-tests:
    name: unit-tests
    needs:
      [
        scope,
        static-artifact,
        package,
        playground,
        playground-production-producer,
        playground-production,
        browser-runner-lifecycle,
        component,
      ]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected lane to succeed
        env:
          SCOPE: ${{ needs.scope.result }}
          STATIC: ${{ needs.static-artifact.result }}
          PACKAGE: ${{ needs.package.result }}
          PLAYGROUND: ${{ needs.playground.result }}
          PLAYGROUND_PRODUCTION_PRODUCER: ${{ needs.playground-production-producer.result }}
          PLAYGROUND_PRODUCTION: ${{ needs.playground-production.result }}
          BROWSER_RUNNER_LIFECYCLE: ${{ needs.browser-runner-lifecycle.result }}
          COMPONENT: ${{ needs.component.result }}
          LANES: ${{ needs.scope.outputs.unit_lanes }}
        run: |
          set -euo pipefail
          echo "scope=$SCOPE lanes=$LANES static=$STATIC package=$PACKAGE playground=$PLAYGROUND playground-production-producer=$PLAYGROUND_PRODUCTION_PRODUCER playground-production=$PLAYGROUND_PRODUCTION browser-runner-lifecycle=$BROWSER_RUNNER_LIFECYCLE component=$COMPONENT" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$SCOPE" = success ] || exit 1
          case ",$LANES," in *,static,*) [ "$STATIC" = success ] || exit 1;; esac
          case ",$LANES," in *,package,*) [ "$PACKAGE" = success ] || exit 1;; esac
          case ",$LANES," in *,playground,*) [ "$PLAYGROUND" = success ] || exit 1;; esac
          case ",$LANES," in *,playground,*) [ "$PLAYGROUND_PRODUCTION" = success ] || exit 1;; esac
          case ",$LANES," in *,playground,*) [ "$PLAYGROUND_PRODUCTION_PRODUCER" = success ] || exit 1;; esac
          [ "$BROWSER_RUNNER_LIFECYCLE" = success ] || exit 1
          case ",$LANES," in *,components,*) [ "$COMPONENT" = success ] || exit 1;; esac
