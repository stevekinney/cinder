name: unit-tests

on:
  pull_request: {}
  merge_group: {}
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.3.13
  TURBO_SCM_BASE: origin/${{ github.base_ref }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      components: ${{ steps.decide.outputs.components }}
      cinder_components: ${{ steps.decide.outputs.cinder_components }}
      unit_lanes: ${{ steps.decide.outputs.unit_lanes }}
      full_scope_reason: ${{ steps.decide.outputs.full_scope_reason }}
      component_matrix: ${{ steps.matrix.outputs.component_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            printf '%s\n' 'mode=full' 'component_scope_mode=full' 'components=' 'cinder_components=' 'unit_lanes=static,package,playground,components' 'full_scope_reason=non-pull-request event' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "origin/${BASE_REF}...HEAD" | bun run packages/testing/scripts/changed-components.ts
          fi
      - id: matrix
        env:
          MODE: ${{ steps.decide.outputs.mode }}
        run: |
          if [ "$MODE" = full ]; then
            echo 'component_matrix={"chunk":[1,2,3,4]}' >> "$GITHUB_OUTPUT"
          else
            echo 'component_matrix={"chunk":[0]}' >> "$GITHUB_OUTPUT"
          fi
      - run: |
          {
            echo '## CI scope'
            echo "- Mode: ${{ steps.decide.outputs.mode }}"
            echo "- Unit lanes: ${{ steps.decide.outputs.unit_lanes }}"
            echo "- Full-scope reason: ${{ steps.decide.outputs.full_scope_reason || 'none' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  static-artifact:
    needs: scope
    if: "!cancelled() && (needs.scope.result != 'success' || contains(needs.scope.outputs.unit_lanes, 'static'))"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: turbo-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Static, generated, and workflow contracts
        run: |
          bunx turbo run lint
          bun run --filter=@lostgradient/cinder lint:invariants
          bunx stylelint 'packages/**/src/**/*.{css,svelte}'
          bun run --filter=@lostgradient/cinder aggregator:check
          bun run --filter=@lostgradient/cinder tokens:audit -- --strict
          bun run --filter=@lostgradient/cinder components:check
          bun run --filter=@lostgradient/chat components:check
          bun run --filter=@lostgradient/editor components:check
          bun run --filter=@lostgradient/cinder validate:consumer:manifest-smoke
          bun run --filter=@lostgradient/cinder validate:release-workflow
          bun test packages/components/scripts/check-css-duplication.test.ts

  package:
    needs: scope
    if: "!cancelled() && (needs.scope.result != 'success' || contains(needs.scope.outputs.unit_lanes, 'package'))"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build and package tests
        env:
          AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          bunx turbo run build --filter=@lostgradient/cinder --filter=@lostgradient/cinder-mcp --filter=@lostgradient/chat $AFFECTED
          bun run test:workspace-scripts
          if [ "${{ github.event_name }}" = pull_request ]; then
            bunx turbo run test --filter="@lostgradient/markdown...[origin/${BASE_REF}...HEAD]" --filter="@lostgradient/editor...[origin/${BASE_REF}...HEAD]" --filter="@lostgradient/cinder-mcp...[origin/${BASE_REF}...HEAD]"
          else
            bunx turbo run test --filter=@lostgradient/markdown --filter=@lostgradient/editor --filter=@lostgradient/cinder-mcp
          fi
          bunx turbo run test:coverage --filter=@lostgradient/chat $AFFECTED

  playground:
    needs: scope
    if: "!cancelled() && (needs.scope.result != 'success' || contains(needs.scope.outputs.unit_lanes, 'playground'))"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            bunx turbo run test --filter="@cinder/playground...[origin/${BASE_REF}...HEAD]"
          else
            bunx turbo run test --filter=@cinder/playground
          fi
          bun run --filter=@cinder/playground check:source-temp

  component:
    needs: scope
    if: "!cancelled() && (needs.scope.result != 'success' || contains(needs.scope.outputs.unit_lanes, 'components'))"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.result == 'success' && needs.scope.outputs.component_matrix || '{"chunk":[1,2,3,4]}') }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - env:
          CINDER_TEST_MODE: ${{ needs.scope.result == 'success' && needs.scope.outputs.mode || 'full' }}
          CINDER_TEST_COMPONENTS: ${{ needs.scope.outputs.cinder_components }}
          CINDER_TEST_FULL_SUITE_CHUNK: ${{ (needs.scope.result != 'success' || needs.scope.outputs.mode == 'full') && matrix.chunk || '' }}
        run: |
          if [ "$CINDER_TEST_MODE" = filtered ] && [ -z "$CINDER_TEST_COMPONENTS" ]; then exit 0; fi
          bun run --filter=@lostgradient/cinder test:changed

  unit-tests:
    name: unit-tests
    needs: [scope, static-artifact, package, playground, component]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected lane to succeed
        env:
          SCOPE: ${{ needs.scope.result }}
          STATIC: ${{ needs.static-artifact.result }}
          PACKAGE: ${{ needs.package.result }}
          PLAYGROUND: ${{ needs.playground.result }}
          COMPONENT: ${{ needs.component.result }}
          LANES: ${{ needs.scope.outputs.unit_lanes }}
        run: |
          set -euo pipefail
          echo "scope=$SCOPE lanes=$LANES static=$STATIC package=$PACKAGE playground=$PLAYGROUND component=$COMPONENT" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$SCOPE" = success ] || exit 1
          case ",$LANES," in *,static,*) [ "$STATIC" = success ] || exit 1;; esac
          case ",$LANES," in *,package,*) [ "$PACKAGE" = success ] || exit 1;; esac
          case ",$LANES," in *,playground,*) [ "$PLAYGROUND" = success ] || exit 1;; esac
          case ",$LANES," in *,components,*) [ "$COMPONENT" = success ] || exit 1;; esac
