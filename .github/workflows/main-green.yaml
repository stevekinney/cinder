name: main-green

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-green-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  BUN_VERSION: 1.3.13
  # main-green is the full-execution safety net for environment/time-dependent
  # breakage on otherwise-unchanged code (nightly cron, pushes that don't touch
  # a given package). A restored .turbo cache would let turbo replay those cache
  # hits instead of re-executing — exactly the case this workflow exists to
  # catch — so force real execution here. unit-tests.yaml deliberately keeps
  # cache hits; do not add this there.
  TURBO_FORCE: 'true'

jobs:
  workspace-gates:
    name: workspace-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No --affected here: main-green is the full-suite safety net (the doc's
      # explicit non-goal is scoping this workflow), so `bun run lint` /
      # `bun run typecheck` below resolve to the turbo-backed root scripts
      # running unfiltered across every workspace package.
      - name: Lint workspace
        run: bun run lint

      - name: Lint invariants (cinder)
        run: bun run --filter=@lostgradient/cinder lint:invariants

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Source audits (cinder)
        run: |
          bun run --filter=@lostgradient/cinder aggregator:check
          bun run --filter=@lostgradient/cinder components:check
          bun run --filter=@lostgradient/cinder check:changeset-prerelease-bumps
          bun run --filter=@lostgradient/cinder check:placeholder-docs
          bun run --filter=@lostgradient/cinder validate:workflow
          bun run --filter=@lostgradient/cinder validate:svelte-peer
          bun run --filter=@lostgradient/cinder platform:audit -- --strict
          bun run --filter=@lostgradient/cinder colors:audit -- --strict
          bun run --filter=@lostgradient/cinder tokens:audit -- --strict
          bun run --filter=@lostgradient/cinder build

      - name: Source audits (chat)
        run: |
          bun run --filter=@lostgradient/chat components:check
          bun run --filter=@lostgradient/chat build
          bun run --filter=@lostgradient/chat platform:audit -- --strict
          bun run --filter=@lostgradient/chat colors:audit -- --strict
          bun run --filter=@lostgradient/chat tokens:audit -- --strict

      - name: Source audits (editor)
        run: |
          bun run --filter=@lostgradient/editor components:check
          bun run --filter=@lostgradient/editor build
          bun run --filter=@lostgradient/editor platform:audit -- --strict
          bun run --filter=@lostgradient/editor colors:audit -- --strict
          bun run --filter=@lostgradient/editor tokens:audit -- --strict

      # The full `bun run test` suite includes @cinder/playground's bundle/route
      # tests (playground-server.test.ts), which bundle the playground FROM
      # SOURCE and resolve private @cinder/* packages plus the public Cinder,
      # Markdown, and Chat packages through built `dist/` subpath exports (e.g.
      # @lostgradient/markdown/pipeline and @lostgradient/cinder/dropdown/styles).
      # Without a prior build those imports fail to resolve and the bundle
      # tests error.
      # The package list is the SAME one the Playwright runner builds in
      # packages/testing/scripts/start-server.ts and is pinned by the
      # "playground bundle dependency build preflight" test in start-server.test.ts
      # — keep this filter list in sync with that test's `toEqual` assertion.
      - name: Build playground bundle dependencies
        run: >-
          bunx turbo run build
          --filter=@lostgradient/markdown
          --filter=@lostgradient/editor
          --filter=@lostgradient/cinder
          --filter=@lostgradient/chat

      - name: Test workspace scripts
        run: bun run test:workspace-scripts

      - name: Test non-Cinder workspaces
        run: >-
          bunx turbo run test
          --filter=@lostgradient/markdown
          --filter=@lostgradient/editor
          --filter=@lostgradient/cinder-mcp
          --filter=@cinder/playground
          --filter=@cinder/testing

      - name: Test Chat package with coverage
        run: bunx turbo run test:coverage --filter=@lostgradient/chat

      # Non-blocking trend signal, not a gate: always exits 0 for the RSS
      # number itself (only a genuine test failure inside the canary's own
      # slice would non-zero it). `continue-on-error: true` is belt-and-
      # suspenders on top of that — a flaky sampling hiccup here must never
      # turn main red. The script itself appends its one-line summary to
      # $GITHUB_STEP_SUMMARY (in addition to printing it to the job log), so
      # no output redirection is needed here.
      - name: Memory canary (non-blocking)
        continue-on-error: true
        run: bun run --filter=@lostgradient/cinder test:memory-canary

      # Exercises the SvelteKit consumer hydration path — the same Chromium
      # launch (validate-consumers.ts) that previously ran ONLY in the release
      # path and crashed there on the runner's `/dev/shm`. A single-version
      # smoke here catches a browser-launch regression on Linux CI every merge,
      # before the release (which waits for this same-SHA main-green run) can
      # publish. NOT continue-on-error: a crash here must go red so the release
      # never publishes on top of a broken hydration path.
      - name: Install Chromium for hydration smoke
        run: bunx playwright install --with-deps chromium

      - name: Consumer hydration smoke (cinder)
        run: bun run --filter=@lostgradient/cinder validate:consumer:hydration-smoke

      # Focused Node-runtime smoke: proves the built cinder-mcp binary speaks
      # the MCP stdio handshake under the ACTUAL `node` on this runner, not
      # just under Bun (which every other build/test step above uses). Full
      # tarball-consumer coverage (npm install, Bun-free env, `npx --no-install`)
      # is release-only (validate:consumer) — this is the cheap per-merge
      # signal that the workspace-built dist/bin.js itself runs under Node.
      - name: Node-runtime smoke (cinder-mcp)
        run: |
          bun run --filter=@lostgradient/cinder-mcp build
          node -e "
            const { spawn } = require('node:child_process');
            const child = spawn('node', ['packages/mcp/dist/bin.js']);
            let out = '';
            let err = '';
            child.stdout.on('data', (d) => { out += d; });
            child.stderr.on('data', (d) => { err += d; });
            const request = JSON.stringify({
              jsonrpc: '2.0',
              id: 1,
              method: 'initialize',
              params: {
                protocolVersion: '2024-11-05',
                capabilities: {},
                clientInfo: { name: 'main-green-smoke', version: '0.0.0' },
              },
            }) + '\n';
            child.stdin.write(request);
            const timeout = setTimeout(() => {
              console.error('cinder-mcp Node smoke timed out. stdout:', out, 'stderr:', err);
              child.kill();
              process.exit(1);
            }, 10000);
            // Node may deliver the initialize response across multiple stdout
            // chunks — check the accumulated buffer on every 'data' event
            // instead of deciding from the first (possibly partial) chunk.
            child.stdout.on('data', () => {
              if (!out.includes('\"name\":\"cinder\"')) return;
              clearTimeout(timeout);
              console.log('cinder-mcp Node smoke OK');
              child.kill();
              process.exit(0);
            });
          "

  component-tests:
    name: component-tests (${{ matrix.chunk }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test cinder components chunk
        env:
          CINDER_TEST_MODE: full
          CINDER_TEST_FULL_SUITE_CHUNK: ${{ matrix.chunk }}
        run: bun run --filter=@lostgradient/cinder test:changed
