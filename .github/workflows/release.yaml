name: release

# Changesets-driven release pipeline for the public `@lostgradient/markdown`,
# `@lostgradient/cinder`, `@lostgradient/cinder-mcp`, `@lostgradient/editor`,
# and `@lostgradient/chat` npm packages. Publish order is
# markdown → cinder → editor → chat → cinder-mcp (markdown has no peers on the
# others; editor peers on cinder and markdown; chat peers on cinder and markdown).
#
# That is the peer/dependency DAG with one deliberate exception: cinder-mcp is a
# leaf — it consumes cinder's `./knowledge` export, so it must follow cinder, but
# nothing depends on it — and it publishes LAST rather than in DAG position, so a
# failure on it cannot abort the other four. See #1207.
#
# On every push to `main`:
#   - If unreleased changesets exist, the action opens (or updates) a
#     "Version Packages" pull request that bumps public package manifests and
#     changelogs. Merging that pull request re-triggers this workflow, which
#     then publishes to npm through npm Trusted Publishing.
#   - If no changesets are pending, the action enters the publish path. Each
#     publish script skips cleanly when that package version already exists on
#     npm.
#
# The publish path validates both package artifacts before publishing either
# (`validate:consumer` + package weight), but it does not rerun the full
# source-validation suite. Source validation is owned by PR CI and main-green;
# the publish path waits for the same-SHA main-green run before publishing.
# Duplicating those checks here makes the release job timeout-prone and turns
# publish into another full test runner instead of an artifact gate.
#
# `workflow_dispatch` exists for manual dry-runs of the same artifact path.

on:
  push:
    branches:
      - main
  # workflow_dispatch is intentionally dry-run only. Real publishes go
  # through merging the "Version Packages" PR into main. If that path
  # breaks, use release-manual.yaml as the break-glass fallback — never
  # publish directly from this workflow on an arbitrary ref.
  workflow_dispatch: {}

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # actions/setup-node writes a .npmrc with _authToken=${NODE_AUTH_TOKEN}.
      # Override it before the npm upgrade so npm never sends an empty or
      # undefined Authorization header on the OIDC publish path.
      - name: Configure npm for trusted publishing
        shell: bash
        run: |
          echo "NPM_CONFIG_USERCONFIG=$HOME/.npmrc" >> "$GITHUB_ENV"
          cat > "$HOME/.npmrc" <<'EOF'
          registry=https://registry.npmjs.org/
          always-auth=false
          EOF

      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cheap pre-check so artifact validation only runs on the publish path.
      # Pending changesets mean this push will just open/
      # update the Version Packages PR (no publish) — that PR's own commits
      # already passed PR CI and main-green, so there is no package artifact to
      # validate here. Excludes .changeset/README.md, which is not a changeset.
      - name: Detect pending changesets
        id: pending-changesets
        run: |
          if [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      # Runs on EVERY push, independent of the artifact-validation decision
      # below. The ignored-package changeset check must not wait for the publish
      # path: an illegal changeset for an ignored package (e.g.
      # @cinder/playground) would otherwise sit unconsumed while
      # `changesets/action` keeps re-opening the Version Packages PR, instead
      # of failing here with the actionable error.
      - name: Guard against ignored-package changesets
        if: github.event_name == 'push'
        run: bun run --filter=@lostgradient/cinder validate:release-workflow

      - name: Guard changeset bump policy
        if: github.event_name == 'push'
        run: bun run --filter=@lostgradient/cinder check:changeset-prerelease-bumps

      # Chromium is only needed by validate:consumer — gate it identically so
      # the no-publish path skips the browser download too.
      - name: Normalize Ubuntu mirror for Playwright dependencies
        if: github.event_name != 'push' || steps.pending-changesets.outputs.pending == 'false'
        run: >-
          sudo sed -i
          's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g'
          /etc/apt/apt-mirrors.txt

      - name: Install Chromium for consumer validation
        if: github.event_name != 'push' || steps.pending-changesets.outputs.pending == 'false'
        run: bunx playwright install --with-deps chromium

      - name: Validate Markdown package artifact
        if: github.event_name != 'push' || steps.pending-changesets.outputs.pending == 'false'
        run: bun run --filter=@lostgradient/markdown validate:consumer

      - name: Validate Cinder package artifact
        if: github.event_name != 'push' || steps.pending-changesets.outputs.pending == 'false'
        run: bun run --filter=@lostgradient/cinder validate:consumer

      - name: Validate Editor package artifact
        if: github.event_name != 'push' || steps.pending-changesets.outputs.pending == 'false'
        run: bun run --filter=@lostgradient/editor validate:consumer

      - name: Validate Chat package artifact
        if: github.event_name != 'push' || steps.pending-changesets.outputs.pending == 'false'
        run: bun run --filter=@lostgradient/chat validate:consumer

      - name: Validate cinder-mcp package artifact
        if: github.event_name != 'push' || steps.pending-changesets.outputs.pending == 'false'
        run: bun run --filter=@lostgradient/cinder-mcp validate:consumer

      - name: Create Release Pull Request or publish to npm
        id: changesets
        if: github.event_name == 'push'
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          setupGitUser: true
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pull request events created by GITHUB_TOKEN require manual approval.
      # Explicit workflow dispatches are the supported exception, so bootstrap
      # validation against the generated branch instead of requiring a human
      # to push an empty commit to the Version Packages pull request.
      - name: Dispatch Version Packages pull request validation
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PULL_REQUEST_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          set -euo pipefail
          release_branch="$(gh pr view "$RELEASE_PULL_REQUEST_NUMBER" --json headRefName --jq '.headRefName')"

          gh workflow run unit-tests.yaml --ref "$release_branch"
          gh workflow run browser-tests.yaml --ref "$release_branch"
          gh workflow run changeset-guard.yaml --ref "$release_branch"
          gh workflow run deploy-playground.yaml --ref "$release_branch" -f environment=preview

      - name: Wait for main-green source validation
        if: github.event_name == 'push' && steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          main_green_run_id=''
          for attempt in 1 2 3 4 5; do
            main_green_run_id="$(gh run list \
              --workflow main-green.yaml \
              --commit "$GITHUB_SHA" \
              --event push \
              --json databaseId \
              --limit 1 \
              --jq '.[0].databaseId // ""')"

            if [ -n "$main_green_run_id" ]; then
              break
            fi

            echo "main-green run for $GITHUB_SHA is not visible yet (attempt $attempt/5)."
            sleep 30
          done

          if [ -z "$main_green_run_id" ]; then
            echo "::error::No main-green push run found for $GITHUB_SHA; refusing to publish without source validation."
            exit 1
          fi

          gh run watch "$main_green_run_id" --exit-status --interval 30

      - name: Check validated Markdown package artifact budget
        if: github.event_name != 'push' || steps.changesets.outputs.hasChangesets == 'false'
        run: bun run --filter=@lostgradient/markdown package:weight:check -- --existing-tarball

      - name: Check validated Cinder package artifact budget
        if: github.event_name != 'push' || steps.changesets.outputs.hasChangesets == 'false'
        run: bun run --filter=@lostgradient/cinder package:weight:check -- --existing-tarball

      - name: Check validated Editor package artifact budget
        if: github.event_name != 'push' || steps.changesets.outputs.hasChangesets == 'false'
        run: bun run --filter=@lostgradient/editor package:weight:check -- --existing-tarball

      - name: Check validated Chat package artifact budget
        if: github.event_name != 'push' || steps.changesets.outputs.hasChangesets == 'false'
        run: bun run --filter=@lostgradient/chat package:weight:check -- --existing-tarball

      - name: Check validated cinder-mcp package artifact budget
        if: github.event_name != 'push' || steps.changesets.outputs.hasChangesets == 'false'
        run: bun run --filter=@lostgradient/cinder-mcp package:weight:check -- --existing-tarball

      # Primary publish path: npm Trusted Publishing (OIDC). No long-lived token.
      # npm >= 11.5.1 (installed above) + id-token: write (on this job) + the npm
      # package's Trusted Publisher configured at registry.npmjs.org automatically
      # exchanges the GitHub OIDC token for a publish grant.
      #
      # Provenance is enabled in every public package's publishConfig and here
      # so the npm attestation records the workflow run and source commit.
      #
      # If this path breaks and a token-based emergency publish is required, use
      # .github/workflows/release-manual.yaml instead (see CONTRIBUTING.md).
      # Publish order follows the peer DAG: Markdown has no internal peers and
      # publishes first; Cinder next (Chat's peer contract starts at the
      # Cinder minor released by the same Version Packages pull request).
      #
      # NOTE: the FIRST publish of @lostgradient/markdown requires a one-time manual
      # bootstrap — npm Trusted Publishing cannot mint a brand-new package name
      # (see the "First-publish bootstrap" note in
      # docs/decisions/package-boundaries.md). Until that bootstrap has run via
      # release-manual.yaml's token path and the Trusted Publisher is
      # configured on npmjs.com, this step will fail with ENEEDAUTH.
      - name: Publish validated Markdown package artifact to npm
        if: github.event_name == 'push' && steps.changesets.outputs.hasChangesets == 'false'
        run: bun run --filter=@lostgradient/markdown publish:release -- --skip-validation
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Publish validated Cinder package artifact to npm
        if: github.event_name == 'push' && steps.changesets.outputs.hasChangesets == 'false'
        run: bun run --filter=@lostgradient/cinder publish:release -- --skip-validation
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Publish validated Editor package artifact to npm
        if: github.event_name == 'push' && steps.changesets.outputs.hasChangesets == 'false'
        run: bun run --filter=@lostgradient/editor publish:release -- --skip-validation
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Publish validated Chat package artifact to npm
        if: github.event_name == 'push' && steps.changesets.outputs.hasChangesets == 'false'
        run: bun run --filter=@lostgradient/chat publish:release -- --skip-validation
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # cinder-mcp publishes LAST, deliberately out of the peer-DAG order used
      # above. Nothing peers on or depends on it — it is a leaf that consumes
      # cinder's `./knowledge` export — so its position is free, and putting a
      # leaf third meant a single auth failure on it took the whole publish path
      # down with it. On 2026-08-05 that is exactly what happened: cinder-mcp
      # 0.1.0 failed with ENEEDAUTH (no Trusted Publisher configured yet for the
      # name, which had only ever been minted at 0.0.0), the step exited 1, and
      # editor 0.2.0 and chat 0.5.0 never ran at all. See #1207.
      #
      # Ordering is not a substitute for the auth fix — a red mcp step still
      # reds the release job. It only bounds the blast radius to the one package
      # that is actually broken.
      - name: Publish validated cinder-mcp package artifact to npm
        if: github.event_name == 'push' && steps.changesets.outputs.hasChangesets == 'false'
        run: bun run --filter=@lostgradient/cinder-mcp publish:release -- --skip-validation
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # Diagnostic dry-run: publish the same staged tarball that
      # validate:consumer installs into the fixture apps.
      - name: Publish Markdown (dry-run)
        if: github.event_name == 'workflow_dispatch'
        run: bun run --filter=@lostgradient/markdown publish:release -- --dry-run --skip-validation

      - name: Publish Cinder (dry-run)
        if: github.event_name == 'workflow_dispatch'
        run: bun run --filter=@lostgradient/cinder publish:release -- --dry-run --skip-validation

      - name: Publish Editor (dry-run)
        if: github.event_name == 'workflow_dispatch'
        run: bun run --filter=@lostgradient/editor publish:release -- --dry-run --skip-validation

      - name: Publish Chat (dry-run)
        if: github.event_name == 'workflow_dispatch'
        run: bun run --filter=@lostgradient/chat publish:release -- --dry-run --skip-validation

      # Mirrors the push path above: cinder-mcp is a leaf and goes last, so a
      # dry-run failure on it still exercises every other package's tarball.
      - name: Publish cinder-mcp (dry-run)
        if: github.event_name == 'workflow_dispatch'
        run: bun run --filter=@lostgradient/cinder-mcp publish:release -- --dry-run --skip-validation
